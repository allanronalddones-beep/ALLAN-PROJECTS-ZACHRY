name: Deploy to GitHub Pages

# Publishes the whole repository root as a static site.
#
# Pages must already be switched on, with Settings -> Pages -> Source set to
# "GitHub Actions". This workflow cannot do that for you: a workflow's
# GITHUB_TOKEN is not permitted to call the "Create a Pages site" API, so
# `configure-pages` with `enablement: true` fails with
# "Resource not accessible by integration". It is therefore left off, and the
# step simply reads the Pages config that already exists.

on:
  push:
    branches: [main]
  workflow_dispatch:          # lets you re-run it by hand from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race. Queue them instead of cancelling, so a push
# landing mid-deploy still ends up published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload the site
        uses: actions/upload-pages-artifact@v3
        with:
          # the repository root — .nojekyll keeps GitHub from running Jekyll
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
